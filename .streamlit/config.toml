[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
borderColor = "#E2E8F0"
baseRadius = "0.75rem"
showWidgetBorder = true

[client]
toolbarMode = "minimal"
showSidebarNavigation = true

[server]
headless = true

[browser]
gatherUsageStats = false
